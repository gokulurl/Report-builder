<header class="fx-appbar">
  <div class="fx-brand"><img src="medinous-logo.svg" alt="Medinous" width="124" height="25" /></div>
  <h4 class="fx-appbar-title">{{ title() }}</h4>
  <span class="spacer"></span>
  <span class="fx-appbar-ctx">Medinous QA Clinic · Administration</span>
  <button class="fx-icon-btn fx-bell" (click)="toggleBell()" [attr.aria-expanded]="bellOpen()"
          [attr.aria-label]="notes.unread() ? notes.unread() + ' new notifications' : 'Notifications'">
    <mat-icon>notifications_none</mat-icon>
    @if (notes.unread()) { <span class="fx-bell-dot">{{ notes.unread() }}</span> }
  </button>
  <button class="fx-icon-btn" matTooltip="Switch module"><mat-icon>apps</mat-icon></button>
  <span class="fx-avatar" matTooltip="Signed in">GM</span>

  @if (bellOpen()) {
    <div class="fx-notes" role="dialog" aria-label="Notifications">
      <div class="fx-notes-head">Notifications</div>
      @for (n of notes.items(); track n.id) {
        <button class="fx-note" [class.unread]="!n.read" (click)="openNote(n)">
          <b>{{ n.title }}</b>
          <span>{{ n.detail }}</span>
          <small>{{ n.time | date: 'dd/MM/yyyy HH:mm' }}</small>
        </button>
      } @empty {
        <p class="fx-hint center">You're all caught up.</p>
      }
    </div>
  }
</header>

<div class="fx-body">
  <nav class="fx-rail" aria-label="Reports sections">
    <a class="fx-rail-item" routerLink="/reports" [class.active]="section() === 'reports'">
      <mat-icon>summarize</mat-icon><span>Reports</span>
    </a>
    <a class="fx-rail-item" routerLink="/schedules" [class.active]="section() === 'schedules'">
      <mat-icon>event_repeat</mat-icon><span>My Schedules</span>
    </a>
    <div class="fx-rail-sep" title="Report design (admins)">Design</div>
    <a class="fx-rail-item" routerLink="/builder" [class.active]="section() === 'builder'">
      <mat-icon>query_stats</mat-icon><span>Builder</span>
    </a>
    <a class="fx-rail-item" routerLink="/builder" [queryParams]="{ tab: 'saved' }" [class.active]="section() === 'saved'">
      <mat-icon>folder_open</mat-icon><span>Load Report</span>
    </a>
  </nav>
  <router-outlet />
</div>
